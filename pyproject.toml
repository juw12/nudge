[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reachback"
version = "0.1.0"
description = "See which friends you've been leaving on read while you doomscroll. Local-only analysis of your own chat exports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["digital-wellbeing", "doomscrolling", "friendship", "instagram", "whatsapp", "telegram", "personal-crm"]

[project.scripts]
reachback = "reachback.cli:main"

[tool.setuptools]
packages = ["reachback", "reachback.parsers"]
