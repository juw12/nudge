[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seen"
version = "0.2.0"
description = "See which friends you've been leaving on read while you doomscroll. Local-only analysis of your own chat exports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["digital-wellbeing", "doomscrolling", "friendship", "instagram", "whatsapp", "telegram", "imessage", "personal-crm"]

[project.scripts]
seen = "seen.cli:main"

[tool.setuptools]
packages = ["seen", "seen.parsers"]
